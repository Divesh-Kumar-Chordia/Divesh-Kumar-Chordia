<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Building data platforms, one block at a time</title>
  <desc id="desc">Colorful toy-like blocks labeled data, platform, and product assemble into a stack beside a software engineering tagline.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #127a70; font-size: 15px; font-weight: 700; }
      .headline { fill: #172b36; font-size: 35px; font-weight: 700; }
      .subhead { fill: #52666e; font-size: 17px; }
      .block-label { fill: #ffffff; font-size: 17px; font-weight: 700; }
      .block-dark { fill: #263746; font-size: 17px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#f0f6f3"/>
  <path d="M0 260H1200" stroke="#d7e4de" stroke-width="2"/>

  <text x="64" y="67" class="eyebrow">SOFTWARE ENGINEER | DATA + PLATFORM</text>
  <text x="64" y="125" class="headline">Building data platforms,</text>
  <text x="64" y="169" class="headline">one block at a time.</text>
  <text x="64" y="211" class="subhead">Pipelines / services / product experiences</text>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -18;0 0;0 0" keyTimes="0;0.22;1" dur="5s" repeatCount="indefinite"/>
    <rect x="815" y="67" width="250" height="58" rx="9" fill="#e86751"/>
    <rect x="840" y="57" width="42" height="14" rx="6" fill="#f18a75"/>
    <rect x="997" y="57" width="42" height="14" rx="6" fill="#f18a75"/>
    <text x="940" y="104" text-anchor="middle" class="block-label">PRODUCT</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -18;0 0;0 0" keyTimes="0;0.22;1" dur="5s" begin="0.55s" repeatCount="indefinite"/>
    <rect x="750" y="139" width="380" height="58" rx="9" fill="#3975bd"/>
    <rect x="785" y="129" width="48" height="14" rx="6" fill="#6b9bd0"/>
    <rect x="916" y="129" width="48" height="14" rx="6" fill="#6b9bd0"/>
    <rect x="1047" y="129" width="48" height="14" rx="6" fill="#6b9bd0"/>
    <text x="940" y="176" text-anchor="middle" class="block-label">PLATFORM</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -18;0 0;0 0" keyTimes="0;0.22;1" dur="5s" begin="1.1s" repeatCount="indefinite"/>
    <rect x="815" y="211" width="250" height="40" rx="9" fill="#e8bb48"/>
    <rect x="840" y="201" width="42" height="14" rx="6" fill="#f2d16f"/>
    <rect x="997" y="201" width="42" height="14" rx="6" fill="#f2d16f"/>
    <text x="940" y="239" text-anchor="middle" class="block-dark">DATA</text>
  </g>
</svg>